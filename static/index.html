<!DOCTYPE html>
<html lang="es">
<head>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FruverOS Pro - Tablero Principal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .bg-pattern {
            background-color: #fafaf9;
            background-image: radial-gradient(#e7e5e4 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .transition-all { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-pattern p-4 md:p-8 text-gray-800 min-h-screen">
    <div class="max-w-6xl mx-auto">

        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-white/50 backdrop-blur-sm p-4 rounded-3xl border border-gray-200 shadow-sm">
            <div class="flex items-center gap-4">
                <div class="bg-gradient-to-br from-green-400 to-emerald-600 p-2 rounded-xl shadow-lg shadow-green-200">
                    <span class="text-2xl">🍏</span>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-700 to-emerald-500 italic tracking-tighter">FruverOS Pro</h1>
                    <p id="saludoUsuario" class="text-gray-500 font-bold uppercase text-[10px] tracking-widest mt-0.5">Cargando...</p>
                </div>
            </div>

            <div class="flex flex-wrap gap-2 justify-center md:justify-end items-center">
                <div id="zonaAdmin" class="hidden flex gap-2">
                    <button onclick="verUsuarios()" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-xs hover:bg-blue-700 transition-all shadow-md flex items-center gap-2">
                        👥 Usuarios
                    </button>
                    <button id="btnAdmin" onclick="generarToken()" class="bg-gray-800 text-yellow-400 border-2 border-gray-800 px-4 py-2 rounded-xl font-bold text-xs hover:bg-gray-700 transition-all uppercase shadow-md flex items-center gap-2">
                        🛡️ <span id="txtToken">Generar Token</span>
                    </button>
                </div>

                <button onclick="cambiarClaveDinamica()" class="bg-white border-2 border-blue-100 text-blue-600 px-4 py-2 rounded-xl font-bold text-xs hover:bg-blue-50 transition-all uppercase shadow-sm flex items-center gap-2">
                    🔑 <span class="hidden md:inline">Clave</span>
                </button>
                <button onclick="cerrarSesion()" class="bg-white border-2 border-red-100 text-red-500 px-4 py-2 rounded-xl font-bold hover:bg-red-50 transition-all uppercase text-xs shadow-sm">
                    🚪 Salir
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <a href="/static/resumen.html" class="group bg-white border-l-8 border-green-500 p-5 rounded-2xl shadow-md hover:shadow-xl transition-all flex items-center justify-between">
                <div>
                    <h3 class="font-black text-lg text-gray-800 group-hover:text-green-600">🛒 Operar</h3>
                    <p class="text-xs text-gray-400 font-bold uppercase">Compras/Ventas</p>
                </div>
                <div class="bg-green-100 p-2 rounded-full text-xl">⚡</div>
            </a>
            <a href="/static/historial.html" class="group bg-white border-l-8 border-blue-500 p-5 rounded-2xl shadow-md hover:shadow-xl transition-all flex items-center justify-between">
                <div>
                    <h3 class="font-black text-lg text-gray-800 group-hover:text-blue-600">📜 Historial</h3>
                    <p class="text-xs text-gray-400 font-bold uppercase">Auditar Deuda</p>
                </div>
                <div class="bg-blue-100 p-2 rounded-full text-xl">🔍</div>
            </a>
            <a href="/static/cierres.html" class="group bg-white border-l-8 border-purple-500 p-5 rounded-2xl shadow-md hover:shadow-xl transition-all flex items-center justify-between">
                <div>
                    <h3 class="font-black text-lg text-gray-800 group-hover:text-purple-600">📅 Cierres</h3>
                    <p class="text-xs text-gray-400 font-bold uppercase">Borrar Días</p>
                </div>
                <div class="bg-purple-100 p-2 rounded-full text-xl">🗑️</div>
            </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-red-50/50 p-6 rounded-[2rem] border border-red-100 shadow-lg relative overflow-hidden">
                <div class="absolute top-0 right-0 -mt-2 -mr-2 text-red-100 text-6xl opacity-50">💸</div>
                <h3 class="text-red-400 font-bold uppercase text-xs tracking-widest mb-1 relative z-10">Yo debo (Proveedores)</h3>
                <p id="totalYoDebo" class="text-4xl font-black text-red-600 tracking-tighter relative z-10">$0</p>
            </div>
            <div class="bg-emerald-50/50 p-6 rounded-[2rem] border border-emerald-100 shadow-lg relative overflow-hidden">
                <div class="absolute top-0 right-0 -mt-2 -mr-2 text-emerald-100 text-6xl opacity-50">💰</div>
                <h3 class="text-emerald-400 font-bold uppercase text-xs tracking-widest mb-1 relative z-10">Me deben (Clientes)</h3>
                <p id="totalBarattaDebe" class="text-4xl font-black text-emerald-600 tracking-tighter relative z-10">$0</p>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[2rem] shadow-xl mb-8 border border-gray-100">
            <h3 class="font-black text-gray-800 uppercase tracking-widest text-sm mb-4">📈 Rendimiento Semanal</h3>
            <div class="relative h-64 w-full">
                <canvas id="ventasChart"></canvas>
            </div>
        </div>

        <div id="cajaBalance" class="p-8 rounded-[2rem] text-white mb-10 text-center shadow-2xl transition-all duration-700 bg-gray-400 relative overflow-hidden">
            <p class="text-xs font-black uppercase tracking-[0.2em] opacity-90 mb-1 relative z-10">Ganancia Neta Estimada</p>
            <h3 id="balanceFinal" class="text-6xl font-black tracking-tighter italic relative z-10">$0</h3>
        </div>

        <div class="flex mb-6 bg-stone-200/50 rounded-2xl p-1.5 shadow-inner border border-stone-200 backdrop-blur-sm">
            <button onclick="cambiarPestaña('cobrar')" id="btnCobrar" class="flex-1 py-3 rounded-xl font-black text-xs transition-all bg-white text-green-700 shadow-sm uppercase tracking-widest">🚚 Clientes</button>
            <button onclick="cambiarPestaña('pagar')" id="btnPagar" class="flex-1 py-3 rounded-xl font-black text-xs transition-all text-gray-500 hover:text-gray-700 uppercase tracking-widest">📦 Proveedores</button>
        </div>

        <div class="mb-6 relative group">
            <input type="text" id="buscadorProv" onkeyup="filtrarProveedores()" placeholder="BUSCAR POR NOMBRE..."
                   class="w-full p-4 pl-14 rounded-2xl border-2 border-stone-200 shadow-sm outline-none text-lg font-black uppercase focus:border-green-400 transition-all bg-white/80">
        </div>

        <div class="bg-white/70 backdrop-blur-md rounded-[2.5rem] shadow-xl overflow-hidden border border-white">
            <div id="listaSaldos" class="divide-y divide-stone-100"></div>
        </div>
    </div>

    <div id="modalUsuarios" class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-lg p-8 rounded-[2.5rem] shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-black text-2xl text-gray-800 uppercase tracking-tight">Gestión de Usuarios</h3>
                <button onclick="cerrarModalUsuarios()" class="text-gray-400 hover:text-red-500 transition-colors text-3xl font-bold">&times;</button>
            </div>
            <div class="overflow-hidden rounded-2xl border border-gray-100">
                <table class="w-full text-left text-xs uppercase font-bold">
                    <thead class="bg-gray-50 text-gray-400 border-b border-gray-100">
                        <tr>
                            <th class="p-4">ID</th>
                            <th class="p-4">Usuario</th>
                            <th class="p-4">Rol</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpoUsuarios" class="divide-y divide-gray-50 text-gray-600"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/static/config.js"></script>
    <script>
        const token = localStorage.getItem('fruverToken');
        const username = localStorage.getItem('fruverUser') || 'Usuario';
        const userRol = localStorage.getItem('rol') || 'VENDEDOR';
        const userId = localStorage.getItem('fruverId');

        let datosGlobales = { proveedores: [], clientes: [] };
        let pestañaActual = 'cobrar';

        // Redirección de seguridad: Si no hay token, fuera.
        if (!token) window.location.href = "/static/login.html";

        // Saludo dinámico
        document.getElementById('saludoUsuario').innerText = `HOLA, ${username.toUpperCase()}`;
        
        // --- FILTRO DE SEGURIDAD ADMIN ---
        if (userRol.toUpperCase() === 'ADMIN') {
            document.getElementById('zonaAdmin').classList.remove('hidden');
        }

        async function cargarTablero() {
            try {
                const res = await CONFIG.solicitar('/saldos-generales');
                if (!res.ok) throw new Error();
                const data = await res.json();
                datosGlobales = data;

                document.getElementById('totalYoDebo').innerText = CONFIG.formatearMoneda(data.total_yo_debo_num || 0);
                document.getElementById('totalBarattaDebe').innerText = CONFIG.formatearMoneda(data.total_baratta_debe_num || 0);
                document.getElementById('balanceFinal').innerText = CONFIG.formatearMoneda(data.balance_num || 0);

                const balanceNum = data.balance_num || 0;
                const caja = document.getElementById('cajaBalance');
                caja.className = `p-8 rounded-[2rem] text-white mb-10 text-center shadow-2xl transition-all duration-700 relative overflow-hidden ${
                    balanceNum > 0 ? 'bg-gradient-to-br from-green-500 to-emerald-700' :
                    balanceNum < 0 ? 'bg-gradient-to-br from-red-500 to-rose-700' : 'bg-gray-400'
                }`;

                renderizarLista();
                cargarGrafica();
            } catch (e) { console.error("Error cargando tablero"); }
        }

        async function verUsuarios() {
            document.getElementById('modalUsuarios').classList.remove('hidden');
            const cuerpo = document.getElementById('tablaCuerpoUsuarios');
            cuerpo.innerHTML = '<tr><td colspan="3" class="p-8 text-center text-gray-400 animate-pulse">Consultando...</td></tr>';
            
            try {
                const res = await CONFIG.solicitar('/admin/usuarios');
                const lista = await res.json();
                
                // Mapeo correcto de los objetos del servidor
                cuerpo.innerHTML = lista.map(u => `
                    <tr class="hover:bg-blue-50/50 transition-colors">
                        <td class="p-4 font-black text-blue-600 text-lg">#${u.id}</td>
                        <td class="p-4 text-gray-800">${u.username.toUpperCase()}</td>
                        <td class="p-4">
                            <span class="px-2 py-1 rounded-md text-[10px] ${u.rol.toUpperCase() === 'ADMIN' ? 'bg-amber-100 text-amber-700' : 'bg-gray-100 text-gray-500'}">
                                ${u.rol.toUpperCase()}
                            </span>
                        </td>
                    </tr>`).join('');
            } catch (e) { 
                cuerpo.innerHTML = '<tr><td colspan="3" class="p-4 text-red-500 text-center">No autorizado o error de red.</td></tr>'; 
            }
        }

        async function generarToken() {
            const btn = document.getElementById('txtToken');
            btn.innerText = "⏳ ESPERE...";
            try {
                const res = await CONFIG.solicitar('/admin/generar-codigo');
                const data = await res.json();
                btn.innerText = `TOKEN: ${data.codigo}`;
                btn.parentElement.classList.add('bg-yellow-400', 'text-black');
                setTimeout(() => {
                    btn.innerText = "Generar Token";
                    btn.parentElement.classList.remove('bg-yellow-400', 'text-black');
                }, 15000);
            } catch (e) { btn.innerText = "ERROR"; }
        }

        async function cambiarClaveDinamica() {
            const { value: formValues } = await Swal.fire({
                title: 'Cambiar Contraseña',
                html:
                    '<input id="swal-newpass" class="swal2-input" placeholder="Nueva Clave" type="password">' +
                    '<input id="swal-token" class="swal2-input" placeholder="Token Admin">',
                focusConfirm: false,
                preConfirm: () => {
                    return [
                        document.getElementById('swal-newpass').value,
                        document.getElementById('swal-token').value
                    ]
                }
            });

            if (formValues && formValues[0] && formValues[1]) {
                try {
                    const res = await CONFIG.solicitar(`/cambiar-password-dinamico?user_id=${userId}&nueva_pass=${encodeURIComponent(formValues[0])}&token_admin=${encodeURIComponent(formValues[1])}`, { method: 'POST' });
                    if (res.ok) { 
                        Swal.fire("Éxito", "Clave cambiada. Inicia sesión de nuevo.", "success").then(() => cerrarSesion()); 
                    } else { 
                        Swal.fire("Error", "Token inválido o expirado", "error"); 
                    }
                } catch (e) { Swal.fire("Error", "No hay conexión", "error"); }
            }
        }

        function renderizarLista() {
            const lista = document.getElementById('listaSaldos');
            const personas = pestañaActual === 'cobrar' ? datosGlobales.clientes : datosGlobales.proveedores;
            const filtro = document.getElementById('buscadorProv').value.toUpperCase();
            
            let filtrados = personas.filter(p => p.nombre.toUpperCase().includes(filtro));
            filtrados.sort((a, b) => (b.dias_mora || 0) - (a.dias_mora || 0));

            if (filtrados.length === 0) {
                lista.innerHTML = `<div class="p-10 text-center text-gray-300 font-bold uppercase text-xs">Sin registros encontrados</div>`;
                return;
            }

            lista.innerHTML = filtrados.map(p => {
                const esUrgente = p.dias_mora >= 10;
                const colorTexto = pestañaActual === 'cobrar' ? 'text-emerald-600' : 'text-red-600';
                return `
                    <div onclick="window.location.href='/static/resumen.html?nombre=${p.nombre}'"
                         class="p-5 flex justify-between items-center hover:bg-stone-50 cursor-pointer transition-all group ${esUrgente ? 'bg-red-50/30' : ''}">
                        <div class="flex items-center gap-4">
                            <div class="h-10 w-10 rounded-xl flex items-center justify-center text-xl ${esUrgente ? 'bg-red-100 text-red-600' : 'bg-stone-100 text-stone-500'}">
                                ${pestañaActual === 'cobrar' ? '👤' : '📦'}
                            </div>
                            <div>
                                <p class="font-black text-gray-800 text-lg uppercase group-hover:text-green-700">${p.nombre} ${esUrgente ? '⚠️' : ''}</p>
                                <p class="text-[10px] text-gray-400 font-black uppercase">Mora: ${p.dias_mora} días</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-xl font-black ${colorTexto}">${p.saldo}</p>
                        </div>
                    </div>`;
            }).join('');
        }

        async function cargarGrafica() {
            try {
                const res = await CONFIG.solicitar('/analisis/ventas-semanales');
                const d = await res.json();
                const ctx = document.getElementById('ventasChart').getContext('2d');
                if (window.miChart) window.miChart.destroy();
                window.miChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: d.labels,
                        datasets: [
                            { label: 'Ventas', data: d.ventas, borderColor: '#22c55e', backgroundColor: 'rgba(34, 197, 94, 0.1)', borderWidth: 3, fill: true, tension: 0.4 },
                            { label: 'Compras', data: d.compras, borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.1)', borderWidth: 3, fill: true, tension: 0.4 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true, ticks: { callback: (v) => '$' + v.toLocaleString() } } }
                    }
                });
            } catch (e) { }
        }

        function cambiarPestaña(tipo) {
            pestañaActual = tipo;
            const btnC = document.getElementById('btnCobrar'); 
            const btnP = document.getElementById('btnPagar');
            
            if(tipo === 'cobrar') {
                btnC.className = "flex-1 py-3 rounded-xl font-black text-xs bg-white text-green-700 shadow-sm uppercase tracking-widest";
                btnP.className = "flex-1 py-3 rounded-xl font-black text-xs text-gray-500 uppercase tracking-widest hover:text-gray-700";
            } else {
                btnP.className = "flex-1 py-3 rounded-xl font-black text-xs bg-white text-red-600 shadow-sm uppercase tracking-widest";
                btnC.className = "flex-1 py-3 rounded-xl font-black text-xs text-gray-500 uppercase tracking-widest hover:text-gray-700";
            }
            renderizarLista();
        }

        function filtrarProveedores() { renderizarLista(); }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "/static/login.html";
        }

        function cerrarModalUsuarios() {
            document.getElementById('modalUsuarios').classList.add('hidden');
        }

        // Inicio
        cargarTablero();
        setInterval(cargarTablero, 60000);
    </script>
</body>
</html>
